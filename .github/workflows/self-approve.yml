name: Auto Approve Self PRs

on:
  pull_request:
    types: [opened, synchronize, labeled, reopened]

concurrency:
  group: self-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  self-approve:
    if: github.actor == github.event.pull_request.user.login && contains(github.event.pull_request.labels.*.name, 'self-approve')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.GH_SELF_APPROVE_APP_ID }}
          private-key: ${{ secrets.GH_SELF_APPROVE_PRIVATE_KEY }}

      - name: Approve unless already approved
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          approved=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" \
            --jq '[.[] | select(.state == "APPROVED")] | length')
          if [ "$approved" -eq 0 ]; then
            echo "no approvals yet, approving"
            gh api "repos/${{ github.repository }}/pulls/$PR/reviews" -f event=APPROVE \
              --jq '"approved: review \(.id) by \(.user.login)"'
          else
            echo "already approved ($approved approvals), skipping"
          fi
